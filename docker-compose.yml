services:
  db:
    image: postgres:17-alpine
    container_name: cinemo-db
    env_file:
      - apps/api/.env
    ports:
      - '5445:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - cinemo-network

volumes:
  db_data:

networks:
  cinemo-network:
    driver: bridge
